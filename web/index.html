<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gcore CaaS 容器探针</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#182235}
.box{max-width:720px;margin:25px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 12px #0002}
button{padding:10px 15px;border:0;border-radius:7px;background:#1769e0;color:#fff;margin:5px;cursor:pointer}
pre{padding:14px;background:#101827;color:#d9e7fb;border-radius:8px;white-space:pre-wrap;word-break:break-word}
.ok{color:#16813b}.bad{color:#b42318}.note{color:#5d6b80}
</style>
</head>

<body>
<main class="box">
<h1>Gcore CaaS 容器探针</h1>
<p class="note">第一阶段：仅检测当前 Gcore 容器。默认端口：8080。</p>

<p>
<button id="basicButton">1. 开始基础检测</button>
<button id="wsButton">2. 测试 WebSocket</button>
<button id="idleButton">3. 开始 10 分钟长连接</button>
<button id="copyButton">复制检测结果</button>
</p>

<p id="status" class="note">等待开始。</p>
<pre id="result">点击“开始基础检测”。</pre>
</main>

<script>
"use strict";

var report = {
  schema: "gcore-caas-probe/v1",
  entry_url: window.location.origin,
  basic: null,
  websocket: null,
  long_connection: null
};

var resultBox = document.getElementById("result");
var statusBox = document.getElementById("status");

function drawReport() {
  report.generated_at = new Date().toISOString();
  resultBox.textContent = JSON.stringify(report, null, 2);
}

function setStatus(text, className) {
  statusBox.textContent = text;
  statusBox.className = className || "note";
}

function requestJson(path) {
  var start = performance.now();

  return fetch(path, {cache: "no-store"})
    .then(function(response) {
      return response.json()
        .catch(function() {
          return {};
        })
        .then(function(data) {
          return {
            ok: response.ok,
            status: response.status,
            latency_ms: Math.round(performance.now() - start),
            data: data
          };
        });
    });
}

function runBasicTest() {
  setStatus("正在检测容器……", "note");

  Promise.all([
    requestJson("/healthz"),
    requestJson("/readyz"),
    requestJson("/api/report"),
    requestJson("/api/headers")
  ])
  .then(function(items) {
    report.basic = {
      healthz: items[0],
      readyz: items[1],
      report: items[2],
      headers: items[3]
    };

    var allOk = items.every(function(item) {
      return item.ok;
    });

    if (allOk) {
      setStatus("基础检测完成：正常。", "ok");
    } else {
      setStatus("基础检测完成：有项目失败，请复制结果。", "bad");
    }

    drawReport();
  })
  .catch(function(error) {
    report.basic = {
      ok: false,
      error: String(error)
    };

    setStatus("基础检测失败。", "bad");
    drawReport();
  });
}

function websocketUrl() {
  var scheme = window.location.protocol === "https:" ? "wss://" : "ws://";
  return scheme + window.location.host + "/ws";
}

function runWebSocketTest() {
  setStatus("正在测试 WebSocket……", "note");

  var start = performance.now();
  var socket;

  try {
    socket = new WebSocket(websocketUrl());
    socket.binaryType = "arraybuffer";
  } catch (error) {
    report.websocket = {
      ok: false,
      error: String(error)
    };
    setStatus("WebSocket 创建失败。", "bad");
    drawReport();
    return;
  }

  var finished = false;

  var timer = window.setTimeout(function() {
    finish(false, "15 秒内没有完成回显");
  }, 15000);

  function finish(ok, message) {
    if (finished) {
      return;
    }

    finished = true;
    window.clearTimeout(timer);

    try {
      socket.close();
    } catch (error) {
    }

    report.websocket = {
      ok: ok,
      message: message,
      elapsed_ms: Math.round(performance.now() - start)
    };

    if (ok) {
      setStatus("WebSocket 测试成功。", "ok");
    } else {
      setStatus("WebSocket 测试失败：" + message, "bad");
    }

    drawReport();
  }

  socket.onopen = function() {
    var data = new Uint8Array(65536);

    for (var i = 0; i < data.length; i++) {
      data[i] = i % 256;
    }

    socket.send(data);
  };

  socket.onmessage = function(event) {
    if (event.data instanceof ArrayBuffer) {
      finish(
        event.data.byteLength === 65536,
        "收到 " + event.data.byteLength + " 字节回显"
      );
    } else {
      finish(false, "收到的不是二进制数据");
    }
  };

  socket.onerror = function() {
    finish(false, "浏览器报告 WebSocket 错误");
  };

  socket.onclose = function(event) {
    if (!finished) {
      finish(false, "连接关闭，代码 " + event.code);
    }
  };
}

function runLongConnectionTest() {
  setStatus("正在连接，10 分钟测试中，请不要刷新页面……", "note");

  var socket;
  var startedAt = Date.now();
  var finished = false;

  try {
    socket = new WebSocket(websocketUrl());
  } catch (error) {
    report.long_connection = {
      ok: false,
      error: String(error)
    };

    setStatus("长连接创建失败。", "bad");
    drawReport();
    return;
  }

  var timer = window.setTimeout(function() {
    if (!finished) {
      finished = true;

      try {
        socket.close(1000, "test complete");
      } catch (error) {
      }

      report.long_connection = {
        ok: true,
        result: "10 分钟内未异常断开",
        duration_seconds: 600
      };

      setStatus("长连接成功：10 分钟未断开。", "ok");
      drawReport();
    }
  }, 600000);

  socket.onopen = function() {
    setStatus("已连接，10 分钟测试中，请保持页面打开……", "note");
  };

  socket.onerror = function() {
  };

  socket.onclose = function(event) {
    if (finished) {
      return;
    }

    finished = true;
    window.clearTimeout(timer);

    var seconds = Math.round((Date.now() - startedAt) / 1000);

    report.long_connection = {
      ok: false,
      result: "连接提前断开",
      duration_seconds: seconds,
      close_code: event.code,
      close_reason: event.reason || ""
    };

    setStatus("长连接提前断开。", "bad");
    drawReport();
  };
}

function copyReport() {
  drawReport();

  var text = "【Gcore CaaS 容器探针结果】\n\n" + resultBox.textContent;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(function() {
        setStatus("已复制，请直接粘贴给我。", "ok");
      })
      .catch(function() {
        setStatus("自动复制失败，请手动复制下方结果。", "note");
      });
  } else {
    setStatus("请手动复制下方结果。", "note");
  }
}

document.getElementById("basicButton").addEventListener("click", runBasicTest);
document.getElementById("wsButton").addEventListener("click", runWebSocketTest);
document.getElementById("idleButton").addEventListener("click", runLongConnectionTest);
document.getElementById("copyButton").addEventListener("click", copyReport);
</script>
</body>
</html>
