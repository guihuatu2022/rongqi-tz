<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gcore CaaS 探针</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#182235}.box{max-width:720px;margin:25px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 12px #0002}button{padding:10px 15px;border:0;border-radius:7px;background:#1769e0;color:#fff;margin:5px;cursor:pointer}pre{padding:14px;background:#101827;color:#d9e7fb;border-radius:8px;white-space:pre-wrap;word-break:break-word}.ok{color:#16813b}.bad{color:#b42318}.note{color:#5d6b80}</style><body><main class="box"><h1>Gcore CaaS 容器探针</h1><p class="note">第一阶段：仅检测当前 Gcore 容器。默认端口：8080。</p><p><button onclick="base()">1. 开始基础检测</button><button onclick="ws()">2. 测试 WebSocket</button><button onclick="idle()">3. 开始 10 分钟长连接</button><button onclick="copy()">复制检测结果</button></p><p id="status" class="note">等待开始。</p><pre id="result">点击“开始基础检测”。</pre></main><script>let R={schema:'gcore-caas-probe/v1',entry_url:location.origin,basic:null,websocket:null,long_connection:null};let out=document.querySelector('#result'),s=document.querySelector('#status');function draw(){R.generated_at=new Date().toISOString();out.textContent=JSON.stringify(R,null,2)}async function api(u){let t=performance.now(),r=await fetch(u,{cache:'no-store'}),b=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,latency_ms:Math.round(performance.now()-t),data:b}}async function base(){s.textContent='正在检测…';try{let a=await Promise.all([api('/healthz'),api('/readyz'),api('/api/report'),api('/api/headers')]);R.basic={healthz:a[0],readyz:a[1],report:a[2],headers:a[3]};s.textContent=a.every(x=>x.ok)?'基础检测完成：正常。':'基础检测有异常，请复制结果。';s.className=a.every(x=>x.ok)?'ok':'bad';draw()}catch(e){R.basic={error:String(e)};s.textContent='基础检测失败。';s.className='bad';draw()}}function url(){return(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'}function ws(){s.textContent='正在测试 WebSocket…';let t=performance.now(),x=new WebSocket(url());x.binaryType='arraybuffer';let timer=setTimeout(()=>finish(false,'超时'),15000);function finish(ok,msg){clearTimeout(timer);try{x.close()}catch(e){}R.websocket={ok:ok,message:msg,connect_or_echo_ms:Math.round(performance.now()-t)};s.textContent=ok?'WebSocket 正常。':'WebSocket 失败：'+msg;s.className=ok?'ok':'bad';draw()}x.onopen=()=>{let d=new Uint8Array(65536);crypto.getRandomValues(d);x.send(d)};x.onmessage=e=>finish(e.data instanceof ArrayBuffer&&e.data.byteLength===65536,'回显 '+(e.data.byteLength||0)+' 字节');x.onerror=()=>finish(false,'浏览器报告 WebSocket 错误');x.onclose=e=>{if(!R.websocket)finish(false,'关闭代码 '+e.code)}}function idle(){s.textContent='10 分钟长连接中，请不要刷新页面。';let start=Date.now(),x=new WebSocket(url()),done=false,timer=setTimeout(()=>doneIt(true,'10分钟内未异常断开',1000),600000);function doneIt(ok,msg,code){if(done)return;done=true;clearTimeout(timer);try{x.close(code||1000)}catch(e){}R.long_connection={ok:ok,result:msg,duration_seconds:Math.round((Date.now()-start)/1000)};s.textContent=ok?'长连接成功：10分钟未断开。':'长连接提前断开：'+msg;s.className=ok?'ok':'bad';draw()}x.onclose=e=>doneIt(false,'关闭代码 '+e.code,e.code);x.onerror=()=>{};x.onopen=()=>s.textContent='已连接，10 分钟测试中，请保持页面打开。'}async function copy(){draw();let text='【Gcore CaaS 容器探针结果】

'+out.textContent;try{await navigator.clipboard.writeText(text);s.textContent='已复制，请直接粘贴给我。';s.className='ok'}catch(e){out.focus();window.getSelection().selectAllChildren(out);s.textContent='请手动复制下方结果。';s.className='note'}}</script></body></html>
